import groovy.json.JsonSlurper
import java.util.Properties
import java.io.FileInputStream

plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"

    // Flutter Gradle Plugin
    id "dev.flutter.flutter-gradle-plugin"

    // Firebase / Google services
    id "com.google.gms.google-services"
}


// ============================================================
// GOOGLE OAUTH CONFIG
// ============================================================

def googleOAuthConfigFile = file("../../config/google_oauth.json")

def googleOAuthConfig = googleOAuthConfigFile.exists()
        ? new JsonSlurper().parse(googleOAuthConfigFile)
        : [:]

def googleServerClientId =
        googleOAuthConfig.GOOGLE_SERVER_CLIENT_ID ?: ""

if (googleServerClientId &&
        !(googleServerClientId ==~ /[0-9A-Za-z._-]+\.apps\.googleusercontent\.com/)) {
    throw new GradleException(
            "GOOGLE_SERVER_CLIENT_ID in config/google_oauth.json is invalid"
    )
}


// ============================================================
// RELEASE KEYSTORE
// ============================================================

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
def releaseKeystoreAvailable = false
def customDebugKeystoreFile = file("nhamhealth-test-debug.keystore")
def customDebugKeystoreAvailable = customDebugKeystoreFile.exists()

if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(
        new FileInputStream(keystorePropertiesFile)
    )
    def configuredStoreFile = keystoreProperties["storeFile"]
    releaseKeystoreAvailable = configuredStoreFile && file(configuredStoreFile).exists()
}


android {
    namespace = "com.example.nhamhealth_flutter"

    compileSdk = 37
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig = true
    }


    // ========================================================
    // DEFAULT CONFIG
    // ========================================================

    defaultConfig {
        applicationId = "com.example.nhamhealth_flutter"

        minSdkVersion = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion

        versionCode = flutter.versionCode
        versionName = flutter.versionName

        buildConfigField(
                "String",
                "GOOGLE_SERVER_CLIENT_ID",
                "\"${googleServerClientId}\""
        )
    }


    // ========================================================
    // RELEASE SIGNING
    // ========================================================

    signingConfigs {
        if (customDebugKeystoreAvailable) {
            nhamhealthDebug {
                storeFile customDebugKeystoreFile
                storePassword "android"
                keyAlias "nhamhealthdebug"
                keyPassword "android"
            }
        }

        release {
            keyAlias = keystoreProperties["keyAlias"]
            keyPassword = keystoreProperties["keyPassword"]
            storeFile = keystoreProperties["storeFile"]
                    ? file(keystoreProperties["storeFile"])
                    : null
            storePassword = keystoreProperties["storePassword"]
        }
    }

    buildTypes {
        debug {
            signingConfig = customDebugKeystoreAvailable
                    ? signingConfigs.nhamhealthDebug
                    : signingConfigs.debug
        }

        release {
            signingConfig = releaseKeystoreAvailable
                    ? signingConfigs.release
                    : (customDebugKeystoreAvailable
                        ? signingConfigs.nhamhealthDebug
                        : signingConfigs.debug)
        }
    }
}


kotlin {
    compilerOptions {
        jvmTarget =
                org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}


flutter {
    source = "../.."
}
