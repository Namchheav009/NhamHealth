import groovy.json.JsonSlurper

plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

def googleOAuthConfigFile = file("../../config/google_oauth.json")
def googleOAuthConfig = googleOAuthConfigFile.exists()
    ? new JsonSlurper().parse(googleOAuthConfigFile)
    : [:]
def googleServerClientId = googleOAuthConfig.GOOGLE_SERVER_CLIENT_ID ?: ""

if (googleServerClientId &&
        !(googleServerClientId ==~ /[0-9A-Za-z._-]+\.apps\.googleusercontent\.com/)) {
    throw new GradleException(
        "GOOGLE_SERVER_CLIENT_ID in config/google_oauth.json is invalid"
    )
}

android {
    namespace = "com.example.nhamhealth_flutter"
    // flutter_secure_storage requires API 37 or newer.
    compileSdk = 37
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.example.nhamhealth_flutter"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdkVersion = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        buildConfigField "String", "GOOGLE_SERVER_CLIENT_ID", "\"${googleServerClientId}\""
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

flutter {
    source = "../.."
}
