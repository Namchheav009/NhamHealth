spring.application.name=nhamhealth_api

# Load local secrets when running from the nhamhealth_api directory. The file
# is optional so the default development setup can continue to use H2.
spring.config.import=optional:file:.env[.properties]

# Allow the untracked .env file to select Supabase for local development while
# leaving tests free to use their isolated H2 configuration.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:}

# Flutter bearer tokens. Always provide a strong JWT_SECRET outside local
# development; changing it signs every user out.
app.auth.jwt.secret=${JWT_SECRET:nhamhealth-local-development-secret-change-me-2026}
app.auth.jwt.issuer=${JWT_ISSUER:nhamhealth-api}
app.auth.jwt.expiration=${JWT_EXPIRATION:PT24H}

# OAuth 2.0 Web client ID used as the audience when verifying Google ID tokens.
app.auth.google.client-id=${GOOGLE_CLIENT_ID:}

# Persistent storage location for uploaded profile images. Set UPLOAD_DIRECTORY
# to a mounted volume in production.
app.upload.directory=${UPLOAD_DIRECTORY:uploads}
# Shared image storage. When URL and service key are configured, uploads are
# stored in a public Supabase Storage bucket so every API instance and PC sees
# the same files. Without them, development continues to use the local folder.
app.storage.supabase.url=${SUPABASE_URL:}
app.storage.supabase.service-key=${SUPABASE_SERVICE_ROLE_KEY:}
app.storage.supabase.bucket=${SUPABASE_STORAGE_BUCKET:nhamhealth-images}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
