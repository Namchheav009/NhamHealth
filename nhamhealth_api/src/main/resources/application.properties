spring.application.name=nhamhealth_api

# Load local secrets when running from the nhamhealth_api directory. The file
# is optional so the default development setup can continue to use H2.
spring.config.import=optional:file:.env[.properties]

# Flutter bearer tokens. Always provide a strong JWT_SECRET outside local
# development; changing it signs every user out.
app.auth.jwt.secret=${JWT_SECRET:nhamhealth-local-development-secret-change-me-2026}
app.auth.jwt.issuer=${JWT_ISSUER:nhamhealth-api}
app.auth.jwt.expiration=${JWT_EXPIRATION:PT24H}
