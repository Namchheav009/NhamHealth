# Supabase PostgreSQL connection. Values are supplied by environment variables
# or by the untracked nhamhealth_api/.env file.
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USERNAME}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Keep well below Supabase's session-pooler client limit. Starting with only one
# idle connection also prevents a second local run from claiming a full pool.
spring.datasource.hikari.data-source-properties.sslmode=require
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT:60000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME:300000}
spring.jpa.properties.hibernate.default_schema=public
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
