<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <title th:text="${pageTitle + ' | Nham Health Admin'}">Post Likes | Nham Health Admin</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/admin-layout.css}">
    <link rel="stylesheet" th:href="@{/css/admin-dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/admin-community-activity.css}">
</head>
<body>
<div class="app-shell">
    <div th:replace="~{layouts/sidebar :: sidebar('post-likes')}"></div>
    <main class="main-area">
        <div th:replace="~{layouts/topbar :: topbar}"></div>
        <section class="page-content">

            <!-- Page Heading -->
            <div class="page-heading">
                <div>
                    <div class="title-line">
                        <h1>Post Likes</h1>
                        <span>Community engagement activity</span>
                    </div>
                    <p>Dashboard &gt; Community &gt; Post Likes</p>
                </div>
                <div class="heading-actions">
                    <button class="btn" id="exportRows"><i class="bi bi-download"></i> Export</button>
                    <button class="btn btn-primary" id="openModal"><i class="bi bi-plus-lg"></i> Add Like</button>
                </div>
            </div>

            <!-- Stats Grid -->
            <div class="stats-grid">
                <article class="stat-card">
                    <div class="stat-icon green"><i class="bi bi-heart-fill"></i></div>
                    <div class="stat-content">
                        <span>Total Likes</span>
                        <strong th:text="${totalLikes}">0</strong>
                    </div>
                </article>
                <article class="stat-card">
                    <div class="stat-icon blue"><i class="bi bi-people"></i></div>
                    <div class="stat-content">
                        <span>Unique Users</span>
                        <strong th:text="${uniqueUsers}">0</strong>
                    </div>
                </article>
                <article class="stat-card">
                    <div class="stat-icon purple"><i class="bi bi-file-post"></i></div>
                    <div class="stat-content">
                        <span>Liked Posts</span>
                        <strong th:text="${likedPosts}">0</strong>
                    </div>
                </article>
            </div>

            <!-- Filters -->
            <section class="filters-grid">
                <div class="field-group">
                    <label for="searchRows">Search</label>
                    <input id="searchRows" type="search" placeholder="User or post">
                </div>
                <button class="btn" id="clearFilters">Clear</button>
            </section>

            <!-- Activity Table -->
            <article class="panel table-panel">
                <div class="panel-header">
                    <h2>Post Like Activity</h2>
                    <button class="action-button" onclick="location.reload()">
                        <i class="bi bi-arrow-clockwise"></i> Refresh
                    </button>
                </div>
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>User</th>
                                <th>Post</th>
                                <th>Liked At</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="activityRows">
                            <tr th:each="l,s:${postLikes}" th:data-id="${l.postLikeId}">
                                <td th:text="${s.count}">1</td>
                                <td>
                                    <strong th:text="${l.user.name}">User</strong>
                                    <small th:text="${l.user.email}">email</small>
                                </td>
                                <td>
                                    <strong th:text="${l.post.title != null && !l.post.title.isBlank() ? l.post.title : 'Post #' + l.post.postId}">Post</strong>
                                    <small th:text="${#strings.abbreviate(l.post.caption, 70)}">Caption</small>
                                </td>
                                <td th:text="${#temporals.format(l.createdAt, 'dd MMM yyyy, HH:mm')}">date</td>
                                <td>
                                    <button class="icon-button danger delete-row">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </td>
                            </tr>
                            <tr th:if="${postLikes.empty}">
                                <td colspan="5" class="empty-state">No post likes found.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </article>

            <!-- Add Like Modal -->
            <div class="modal" id="activityModal">
                <section class="modal-card">
                    <div class="modal-header">
                        <h2>Add Post Like</h2>
                        <button class="icon-button" id="closeModal"><i class="bi bi-x-lg"></i></button>
                    </div>
                    <form id="activityForm">
                        <div class="modal-body">
                            <div class="field-group">
                                <label for="userId">User</label>
                                <select id="userId" required>
                                    <option value="">Select user</option>
                                    <option th:each="u:${users}" th:value="${u.userId}" th:text="${u.name + ' · ' + u.email}"></option>
                                </select>
                            </div>
                            <div class="field-group">
                                <label for="postId">Post</label>
                                <select id="postId" required>
                                    <option value="">Select post</option>
                                    <option th:each="p:${posts}" th:value="${p.postId}" th:text="${p.title != null && !p.title.isBlank() ? p.title : 'Post #' + p.postId}"></option>
                                </select>
                            </div>
                        </div>
                        <div class="modal-actions">
                            <button class="btn" type="button" id="cancelModal">Cancel</button>
                            <button class="btn btn-primary" type="submit">Add Like</button>
                        </div>
                    </form>
                </section>
            </div>

        </section>
        <footer class="page-footer">
            <span>© 2026 Nham Health.</span>
            <span>Version 1.0.0</span>
        </footer>
    </main>
</div>

<div class="sidebar-overlay" id="sidebarOverlay"></div>

<script th:src="@{/js/admin-layout.js}"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script th:src="@{/js/admin-post-likes.js}"></script>

</body>
</html>
