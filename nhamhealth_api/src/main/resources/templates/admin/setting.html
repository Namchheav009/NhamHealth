<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle + ' | Nham Health Admin'}">Settings | Nham Health Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/admin-layout.css}">
    <link rel="stylesheet" th:href="@{/css/admin-dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/admin-setting.css}">
</head>
<body>
<div class="app-shell">
    <div th:replace="~{layouts/sidebar :: sidebar('settings')}"></div>
    <main class="main-area">
        <div th:replace="~{layouts/topbar :: topbar}"></div>

        <section class="page-content">
            <div class="page-heading">
                <div>
                    <div class="title-line">
                        <h1>Settings</h1>
                        <span>Manage platform configuration and preferences.</span>
                    </div>
                    <p>Dashboard &gt; System &gt; Settings</p>
                </div>
                <div class="heading-actions">
                    <button class="btn btn-primary" type="button">Save Changes</button>
                </div>
            </div>

            <div class="settings-grid">
                <article class="panel settings-card">
                    <div class="panel-header">
                        <h2>General Settings</h2>
                    </div>
                    <div class="setting-group">
                        <label for="siteName">Site Name</label>
                        <input id="siteName" type="text" value="Nham Health">
                    </div>
                    <div class="setting-group">
                        <label for="supportEmail">Support Email</label>
                        <input id="supportEmail" type="email" value="support@nhamhealth.com">
                    </div>
                    <div class="setting-group">
                        <label for="maintenanceMode">Maintenance Mode</label>
                        <select id="maintenanceMode">
                            <option value="off">Off</option>
                            <option value="on">On</option>
                        </select>
                    </div>
                </article>

                <article class="panel settings-card">
                    <div class="panel-header">
                        <h2>Security</h2>
                    </div>
                    <div class="setting-group">
                        <label for="passwordPolicy">Password Policy</label>
                        <select id="passwordPolicy">
                            <option>Strong</option>
                            <option>Medium</option>
                            <option>Basic</option>
                        </select>
                    </div>
                    <div class="setting-group">
                        <label for="twoFactor">Two-Factor Authentication</label>
                        <select id="twoFactor">
                            <option value="enabled">Enabled</option>
                            <option value="disabled">Disabled</option>
                        </select>
                    </div>
                </article>

                <article class="panel settings-card">
                    <div class="panel-header">
                        <h2>Notifications</h2>
                    </div>
                    <div class="setting-group">
                        <label for="emailNotify">Email Notifications</label>
                        <select id="emailNotify">
                            <option value="enabled">Enabled</option>
                            <option value="disabled">Disabled</option>
                        </select>
                    </div>
                    <div class="setting-group">
                        <label for="pushNotify">Push Notifications</label>
                        <select id="pushNotify">
                            <option value="enabled">Enabled</option>
                            <option value="disabled">Disabled</option>
                        </select>
                    </div>
                </article>
            </div>
        </section>

        <footer class="page-footer">
            <span>© 2026 Nham Health. All rights reserved.</span>
            <span>Version 1.0.0</span>
        </footer>
    </main>
</div>

<div class="sidebar-overlay" id="sidebarOverlay"></div>

<script th:src="@{/js/admin-layout.js}"></script>
<script th:src="@{/js/admin-setting.js}"></script>
</body>
</html>
