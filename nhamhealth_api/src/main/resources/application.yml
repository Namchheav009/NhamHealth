spring:
  datasource:
    hikari:
      # Keep each deployment below Supavisor's small session-mode allowance.
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAX_POOL_SIZE:2}
      minimum-idle: ${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:0}
      idle-timeout: ${SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT:30000}
      max-lifetime: ${SPRING_DATASOURCE_HIKARI_MAX_LIFETIME:180000}
      keepalive-time: ${SPRING_DATASOURCE_HIKARI_KEEPALIVE_TIME:60000}
      connection-timeout: ${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:30000}
      initialization-fail-timeout: ${SPRING_DATASOURCE_HIKARI_INITIALIZATION_FAIL_TIMEOUT:30000}

app:
  ai:
    gemini:
      api-key: ${APP_AI_GEMINI_API_KEY:${GEMINI_API_KEY:}}
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
      model: ${GEMINI_MODEL:gemini-3.8-flash}
      fallback-model: ${GEMINI_FALLBACK_MODEL:gemini-3.7-flash}
      text-max-tokens: ${GEMINI_TEXT_MAX_TOKENS:8192}
      rate-limit-cooldown: ${GEMINI_RATE_LIMIT_COOLDOWN:PT10M}
  sms:
    plasgate:
      enabled: ${PLASGATE_SMS_ENABLED:true}
      fallback-to-console: ${PLASGATE_SMS_FALLBACK_TO_CONSOLE:false}
      base-url: ${PLASGATE_BASE_URL:https://cloudapi.plasgate.com}
      private-key: ${PLASGATE_PRIVATE_KEY:}
      secret-key: ${PLASGATE_SECRET_KEY:}
      sender-id: ${PLASGATE_SENDER_ID:PlasGateUAT}
      fallback-sender-id: ${PLASGATE_FALLBACK_SENDER_ID:}
