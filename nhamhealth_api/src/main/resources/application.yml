spring:
  servlet:
    multipart:
      max-file-size: ${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:15MB}
      max-request-size: ${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:50MB}
  datasource:
    hikari:
      # Keep each deployment below Supavisor's small session-mode allowance.
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAX_POOL_SIZE:2}
      minimum-idle: ${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:0}
      idle-timeout: ${SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT:30000}
      max-lifetime: ${SPRING_DATASOURCE_HIKARI_MAX_LIFETIME:180000}
      keepalive-time: ${SPRING_DATASOURCE_HIKARI_KEEPALIVE_TIME:60000}
      connection-timeout: ${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:30000}
      initialization-fail-timeout: ${SPRING_DATASOURCE_HIKARI_INITIALIZATION_FAIL_TIMEOUT:30000}
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    baseline-version: 0
    # The production database has migrations from the previous versioned
    # migration set. Allow a later-added corrective migration (for example V6)
    # to run when a higher version is already recorded in schema history.
    out-of-order: ${SPRING_FLYWAY_OUT_OF_ORDER:true}
    connect-retries: 5
    connect-retries-interval: 10s
  mail:
    host: ${SPRING_MAIL_HOST:${MAIL_HOST:smtp.gmail.com}}
    port: ${SPRING_MAIL_PORT:${MAIL_PORT:587}}
    username: ${SPRING_MAIL_USERNAME:${GMAIL_USERNAME:${MAIL_USERNAME:nhamhealth.info@gmail.com}}}
    password: ${SPRING_MAIL_PASSWORD:${GMAIL_APP_PASSWORD:${MAIL_PASSWORD:}}}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
    default-encoding: UTF-8

app:
  mail:
    from: ${APP_MAIL_FROM:${MAIL_FROM:nhamhealth.info@gmail.com}}
    fallback-to-console: ${APP_MAIL_FALLBACK_TO_CONSOLE:false}
  follow-connections:
    rate-limit:
      max-requests: ${FOLLOW_CONNECTION_RATE_LIMIT_MAX:20}
      window: ${FOLLOW_CONNECTION_RATE_LIMIT_WINDOW:PT1M}
  ai:
    gemini:
      api-key: ${GEMINI_API_KEY:${APP_AI_GEMINI_API_KEY:}}
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}

      model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
      assistant-model: ${GEMINI_ASSISTANT_MODEL:${GEMINI_MODEL:gemini-3.5-flash-lite}}
      fallback-model: ${GEMINI_FALLBACK_MODEL:gemini-3.6-flash}

      vision-model: ${GEMINI_VISION_MODEL:gemini-3.5-flash-lite}
      vision-fallback-model: ${GEMINI_VISION_FALLBACK_MODEL:gemini-3.6-flash}

      nutrition-model: ${GEMINI_NUTRITION_MODEL:gemini-3.5-flash-lite}
      nutrition-fallback-model: ${GEMINI_NUTRITION_FALLBACK_MODEL:gemini-3.6-flash}

      recommendation-model: ${GEMINI_RECOMMENDATION_MODEL:gemini-3.5-flash-lite}
      recommendation-fallback-model: ${GEMINI_RECOMMENDATION_FALLBACK_MODEL:gemini-3.6-flash}
      meal-planner-model: ${GEMINI_MEAL_PLANNER_MODEL:${GEMINI_RECOMMENDATION_MODEL:gemini-3.5-flash-lite}}
      meal-planner-fallback-model: ${GEMINI_MEAL_PLANNER_FALLBACK_MODEL:${GEMINI_FALLBACK_MODEL:gemini-3.6-flash}}

      text-max-tokens: ${GEMINI_TEXT_MAX_TOKENS:8192}
      rate-limit-cooldown: ${GEMINI_RATE_LIMIT_COOLDOWN:PT1M}

  sms:
    plasgate:
      enabled: ${PLASGATE_SMS_ENABLED:true}
      fallback-to-console: ${PLASGATE_SMS_FALLBACK_TO_CONSOLE:false}
      base-url: ${PLASGATE_BASE_URL:https://cloudapi.plasgate.com}
      private-key: ${PLASGATE_PRIVATE_KEY:}
      secret-key: ${PLASGATE_SECRET_KEY:}
      sender-id: ${PLASGATE_SENDER_ID:PlasGateUAT}
      fallback-sender-id: ${PLASGATE_FALLBACK_SENDER_ID:SMS Info}

brevo:
  api-key: ${BREVO_API_KEY:${APP_BREVO_API_KEY:}}
  sender-email: ${BREVO_SENDER_EMAIL:${APP_MAIL_FROM:nhamhealth.info@gmail.com}}
  sender-name: ${BREVO_SENDER_NAME:NhamHealth}
